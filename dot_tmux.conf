# -- terminal & display --------------------------------------------------------

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",alacritty:RGB"
set -ag terminal-overrides ",ghostty:RGB"

# Undercurl support (renders LSP diagnostic squiggles in Neovim)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Strikethrough support
set -as terminal-overrides ',*:smxx=\E[9m'

# -- general options -----------------------------------------------------------

set -g history-limit 100000
set -g display-time 2000
set -g focus-events on
set -s escape-time 0
set -g mouse on

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Activity alerts
setw -g monitor-activity on
set -g visual-activity off

# -- prefix key ----------------------------------------------------------------

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# -- keybindings ---------------------------------------------------------------

bind R source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# Splits (in current path)
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z

# Window navigation
bind -r p previous-window
bind -r n next-window

# -- copy mode -----------------------------------------------------------------

setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# -- plugins -------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# -- theme ---------------------------------------------------------------------

set -g status-style 'bg=#000000,fg=#ffffff'
set -g status-left-style 'bg=#005f5f,fg=#ffffff,bold'
set -g status-right-style 'bg=#303030,fg=#ffffff'
set -g window-status-style 'bg=#000000,fg=#bfc0c4'
set -g window-status-current-style 'bg=#005f5f,fg=#ffffff,bold'
set -g pane-border-style 'fg=#646464'
set -g pane-active-border-style 'fg=#00bcff'
set -g message-style 'bg=#303030,fg=#ffffff'
set -g mode-style 'bg=#005f5f,fg=#ffffff'

# -- plugin settings -----------------------------------------------------------

# Resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# -- neovim integration -------------------------------------------------------

# Detect Neovim to pass through C-h/j/k/l and M-h/j/k/l
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?)(diff)?$'"

# Navigation: C-h/j/k/l
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Resizing: M-h/j/k/l
bind-key -n M-h if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 3'

# -- run tpm -------------------------------------------------------------------

run '~/.tmux/plugins/tpm/tpm'
