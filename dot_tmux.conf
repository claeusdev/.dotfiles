# -- terminal & display --------------------------------------------------------

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",alacritty:RGB"
set -ag terminal-overrides ",ghostty:RGB"

# Undercurl support (renders LSP diagnostic squiggles in Neovim)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Strikethrough support
set -as terminal-overrides ',*:smxx=\E[9m'

# -- general options -----------------------------------------------------------

set -g history-limit 100000
set -g display-time 2000
set -g focus-events on
set -s escape-time 0
set -g mouse off

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Activity alerts
setw -g monitor-activity on
set -g visual-activity off

# -- prefix key ----------------------------------------------------------------

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# -- keybindings ---------------------------------------------------------------

bind R source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# Splits (in current path)
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z

# Window navigation
bind -r p previous-window
bind -r n next-window

# -- copy mode -----------------------------------------------------------------

setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# -- plugins -------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'TheSast/tmux-transient-status'

# -- theme (modus vivendi) ----------------------------------------------------

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#000000,fg=#ffffff"

# Left: session name pill
set -g status-left "#[fg=#2fafff,bg=#000000]#[fg=#000000,bg=#2fafff,bold]  #S #[fg=#2fafff,bg=#000000]"
set -g status-left-length 30

# Right: mode indicator + directory pill + time pill
set -g status-right "#{tmux_mode_indicator}#[fg=#1e1e1e,bg=#000000]#[fg=#c6daff,bg=#1e1e1e] #{b:pane_current_path} #[fg=#1e1e1e,bg=#000000]#[fg=#535353,bg=#000000]#[fg=#ffffff,bg=#535353]  %H:%M #[fg=#535353,bg=#000000]"
set -g status-right-length 80

# Inactive window tabs
set -g window-status-format "#[fg=#1e1e1e,bg=#000000]#[fg=#989898,bg=#1e1e1e] #I:#W #[fg=#1e1e1e,bg=#000000]"

# Active window tab
set -g window-status-current-format "#[fg=#79a8ff,bg=#000000]#[fg=#000000,bg=#79a8ff,bold] #I:#W #[fg=#79a8ff,bg=#000000]"

set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#1e1e1e"
set -g pane-active-border-style "fg=#b6a0ff"

# Message and command line
set -g message-style "bg=#1e1e1e,fg=#ffffff"
set -g message-command-style "bg=#1e1e1e,fg=#ffffff"

# Copy mode highlight
set -g mode-style "bg=#535353,fg=#ffffff"

# Clock
set -g clock-mode-colour "#2fafff"

# -- plugin settings -----------------------------------------------------------

# Resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Continuum
set -g @continuum-restore 'off'

# Mode indicator (modus vivendi)
set -g @mode_indicator_prefix_prompt ' WAIT '
set -g @mode_indicator_copy_prompt ' COPY '
set -g @mode_indicator_sync_prompt ' SYNC '
set -g @mode_indicator_empty_prompt ' TMUX '
set -g @mode_indicator_prefix_mode_style 'bg=#fec43f,fg=#000000,bold'
set -g @mode_indicator_copy_mode_style 'bg=#44bc44,fg=#000000,bold'
set -g @mode_indicator_sync_mode_style 'bg=#ff5f59,fg=#000000,bold'
set -g @mode_indicator_empty_mode_style 'bg=#535353,fg=#ffffff'

# Transient status (auto-hide after 5s of idle)
set -g @transient-status-delay '5'
set -g @transient-status-stall '0.5'

# -- neovim integration -------------------------------------------------------

# Detect Neovim to pass through C-h/j/k/l and M-h/j/k/l
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?)(diff)?$'"

# Navigation: C-h/j/k/l
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Resizing: M-h/j/k/l
bind-key -n M-h if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 3'

# -- sesh session manager ------------------------------------------------------

bind-key T display-popup -E -w 40% "sesh connect \"$(
  sesh list -i | fzf-tmux -p 55%,60% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list -i)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -it)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -ic)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -iz)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {})+reload(sesh list -i)'
)\""

# -- run tpm -------------------------------------------------------------------

run '~/.tmux/plugins/tpm/tpm'
