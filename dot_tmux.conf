# -- terminal & display --------------------------------------------------------

# True colour. tmux 3.2 moved this to terminal-features; the older
# `terminal-overrides ,<term>:RGB` idiom is silently ignored -- measured on
# tmux 3.4, no override form sets the terminal's RGB flag, an exact TERM match
# included. Ghostty's terminfo advertises Tc and setrgbf but not RGB, so tmux
# will not work it out on its own either.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",alacritty:RGB"

# Undercurl (LSP diagnostic squiggles in Neovim) and strikethrough are real
# terminfo string capabilities, so these stay as overrides.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -as terminal-overrides ',*:smxx=\E[9m'

# -- general options -----------------------------------------------------------

set -g history-limit 100000
set -g display-time 2000
set -g focus-events on
set -s escape-time 0
set -g mouse on

# Send copies to the outer terminal's clipboard via OSC52 as well. Locally
# tmux-yank already pipes to xsel; this is what makes yanking work when tmux is
# running on the far end of an SSH connection, where xsel cannot reach back.
set -g set-clipboard on

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Activity alerts
setw -g monitor-activity on
set -g visual-activity off

# -- prefix key ----------------------------------------------------------------

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# -- keybindings ---------------------------------------------------------------

bind R source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# Splits (in current path)
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Zoom. Deliberately not -r: it is a toggle, so a second press inside
# repeat-time would just undo it.
bind m resize-pane -Z

# Window navigation
bind -r p previous-window
bind -r n next-window

# -- copy mode -----------------------------------------------------------------

setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# -- plugins -------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'

# -- theme ---------------------------------------------------------------------

# modus-vivendi-tinted -- the palette Emacs, Neovim and Ghostty already use.
# Hexes lifted from modus-themes.nvim's own tmux extra for this exact variant,
# so they track upstream instead of being eyeballed:
#   bg-main #0d0e1c   bg-dim #1d2235   bg-active #4a4f69   border #61647a
#   fg-main #ffffff   fg-dim #989898   blue-warmer #79a8ff (accent)
#   red #ff5f59       yellow-warmer #fec43f
#
# Three weights, strongest first: the session block on the accent, the current
# window on bg-active with an accent edge, everything else dim with no
# background. No Nerd Font glyphs -- the only non-ASCII here is U+258E and
# U+2502, which any reasonable monospace font covers, so the bar still reads
# after an ssh to a machine that lacks your fonts.

set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style 'bg=#1d2235,fg=#989898'

# Session name, doubling as the prefix indicator: the block turns red while the
# prefix is held. Easier to catch out of the corner of an eye than a marker in a
# corner, and it costs no width.
set -g status-left-length 40
set -g status-left '#[fg=#0d0e1c,bg=#{?client_prefix,#ff5f59,#79a8ff},bold] #S #[fg=#61647a,bg=#1d2235]│ '

# Windows. The current one carries a background AND an accent edge: background
# alone was easy to lose at a glance across a wide bar.
set -g window-status-separator ''
set -g window-status-format '#[fg=#989898]#I #W  '
set -g window-status-current-format '#[fg=#79a8ff,bg=#4a4f69]▎#[fg=#ffffff,bg=#4a4f69,bold] #I #W#{?window_zoomed_flag, Z,} #[fg=#989898,bg=#1d2235]  '
set -g window-status-activity-style 'fg=#fec43f,none'
set -g window-status-bell-style 'fg=#ff5f59,bold'

# Hairline first, so the clock stops butting against the window list.
set -g status-right-length 60
set -g status-right '#[fg=#61647a]│ #[fg=#989898]%a %d %b  #[fg=#ffffff,bold]%H:%M '

set -g pane-border-style 'fg=#61647a'
set -g pane-active-border-style 'fg=#79a8ff'
set -g message-style 'bg=#4a4f69,fg=#ffffff,bold'
set -g mode-style 'bg=#4a4f69,fg=#ffffff'
set -g display-panes-colour '#61647a'
set -g display-panes-active-colour '#79a8ff'

# -- plugin settings -----------------------------------------------------------

# Resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# -- neovim integration -------------------------------------------------------

# C-h/j/k/l pane navigation that passes through to Neovim's window commands is
# provided by vim-tmux-navigator (declared above), together with its Neovim-side
# plugin. Both halves are needed: without the Neovim side, C-h in the leftmost
# window is swallowed by Neovim and focus never returns to the tmux pane.
# It also binds C-\ for the previously active pane.

# Resizing: M-h/j/k/l. Unconditional on purpose. Neovim binds no M- keys, so the
# old if-shell passthrough sent them into Neovim to be discarded, which meant
# panes could not be resized at all while Neovim held focus.
bind-key -n M-h resize-pane -L 3
bind-key -n M-j resize-pane -D 3
bind-key -n M-k resize-pane -U 3
bind-key -n M-l resize-pane -R 3

# C-l is taken by pane navigation, so clear-screen never reaches the shell.
# Put it back on the prefix.
bind C-l send-keys 'C-l'

# -- run tpm -------------------------------------------------------------------

run '~/.tmux/plugins/tpm/tpm'

# Auto-install: adding a `set -g @plugin' line above is all it takes. TPM's own
# instruction is `prefix + I', which is easy to forget and fails quietly -- the
# plugin simply never loads and nothing says why.
#
# install_plugins clones what is declared but missing, and does NOT source what
# it clones, so the config has to be re-read afterwards or a new plugin sits on
# disk inert. Re-read only when something was actually fetched: that is what
# makes this terminate rather than loop, since the second pass finds nothing
# missing. Costs at most one extra config load per newly added plugin, and a
# no-op run is ~35ms, backgrounded.
run -b '[ -x $HOME/.tmux/plugins/tpm/bin/install_plugins ] || exit 0; out=$($HOME/.tmux/plugins/tpm/bin/install_plugins); case "$out" in *"download success"*) tmux source-file $HOME/.tmux.conf;; esac'
