# -- terminal & display --------------------------------------------------------

# True colour. tmux 3.2 moved this to terminal-features; the older
# `terminal-overrides ,<term>:RGB` idiom is silently ignored -- measured on
# tmux 3.4, no override form sets the terminal's RGB flag, an exact TERM match
# included. Ghostty's terminfo advertises Tc and setrgbf but not RGB, so tmux
# will not work it out on its own either.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",alacritty:RGB"

# Undercurl (LSP diagnostic squiggles in Neovim) and strikethrough are real
# terminfo string capabilities, so these stay as overrides.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -as terminal-overrides ',*:smxx=\E[9m'

# -- general options -----------------------------------------------------------

set -g history-limit 100000
set -g display-time 2000
set -g focus-events on
set -s escape-time 0
set -g mouse on

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Activity alerts
setw -g monitor-activity on
set -g visual-activity off

# -- prefix key ----------------------------------------------------------------

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# -- keybindings ---------------------------------------------------------------

bind R source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# Splits (in current path)
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z

# Window navigation
bind -r p previous-window
bind -r n next-window

# -- copy mode -----------------------------------------------------------------

setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# -- plugins -------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# -- theme ---------------------------------------------------------------------

# modus-vivendi-tinted -- the palette Emacs, Neovim and Ghostty already use.
# Hexes lifted from modus-themes.nvim's own tmux extra for this exact variant,
# so they track upstream instead of being eyeballed:
#   bg-main #0d0e1c   bg-dim #1d2235   bg-active #4a4f69   border #61647a
#   fg-main #ffffff   fg-dim #989898   blue-warmer #79a8ff (accent)
#   red #ff5f59       yellow-warmer #fec43f

set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style 'bg=#1d2235,fg=#989898'

set -g status-left-length 40
set -g status-left '#[fg=#0d0e1c,bg=#79a8ff,bold] #S #[default] '

# Windows sit flat and dim; the current one is lifted with bg-active rather
# than another colour, so the accent keeps meaning "session" and nothing else.
set -g window-status-separator ''
set -g window-status-format '#[fg=#989898] #I #W '
set -g window-status-current-format '#[fg=#ffffff,bg=#4a4f69,bold] #I #W#{?window_zoomed_flag, Z,} '
set -g window-status-activity-style 'fg=#fec43f,none'
set -g window-status-bell-style 'fg=#ff5f59,bold'

set -g status-right-length 60
set -g status-right '#[fg=#989898]%a %d %b  #[fg=#ffffff]%H:%M '

set -g pane-border-style 'fg=#61647a'
set -g pane-active-border-style 'fg=#79a8ff'
set -g message-style 'bg=#4a4f69,fg=#ffffff,bold'
set -g mode-style 'bg=#4a4f69,fg=#ffffff'
set -g display-panes-colour '#61647a'
set -g display-panes-active-colour '#79a8ff'

# -- plugin settings -----------------------------------------------------------

# Resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# -- neovim integration -------------------------------------------------------

# Detect Neovim to pass through C-h/j/k/l and M-h/j/k/l
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?)(diff)?$'"

# Navigation: C-h/j/k/l
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Resizing: M-h/j/k/l
bind-key -n M-h if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 3'

# -- run tpm -------------------------------------------------------------------

run '~/.tmux/plugins/tpm/tpm'
