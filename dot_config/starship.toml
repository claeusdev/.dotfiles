# Starship Prompt Configuration
# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Timeout for starship to scan files (milliseconds)
scan_timeout = 30
command_timeout = 500

# Inserts a blank line between shell prompts
add_newline = true

# Active modus palette. Switched by theme-mode(1), which for light mode points
# STARSHIP_CONFIG at a generated copy of this file with this one line rewritten
# -- starship cannot select a palette from the environment.
palette = "modus_dark"

# Format
format = """
[┌─](bold green)$username$hostname$directory$git_branch$git_status$git_state
[└─](bold green)$character"""

# Right format (shown on the right side)
right_format = """$cmd_duration$nodejs$rust$python$golang$lua"""

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
vimcmd_symbol = "[](bold green)"

[username]
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style) "
disabled = false
show_always = true

[hostname]
ssh_only = false
format = "on [$hostname](bold yellow) "
disabled = false

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"
read_only = " 󰌾"
format = "in [$path]($style)[$read_only]($read_only_style) "
home_symbol = "~"

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = "✓"
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
min_time = 500
format = "took [$duration](bold yellow) "

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
style = "bold yellow"
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[rust]
symbol = " "
style = "bold red"
format = "via [$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold cyan"
format = "via [$symbol($version )]($style)"

[lua]
symbol = " "
style = "bold blue"
format = "via [$symbol($version )]($style)"

[package]
symbol = "📦 "
style = "208"
format = "is [$symbol$version]($style) "
disabled = false

[docker_context]
symbol = " "
style = "blue bold"
format = "via [$symbol$context]($style) "
disabled = false

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[battery]
full_symbol = "🔋"
charging_symbol = "🔌"
discharging_symbol = "⚡"

[[battery.display]]
threshold = 30
style = "bold red"

# Modus palettes. Every value is the colour Neovim actually renders for the
# matching highlight group under modus_vivendi (tinted) / modus_operandi, read
# out of nvim_get_hl -- the same source the fish and tmux themes use.
#
# These deliberately shadow starship's built-in colour names, which is why not
# one style string above had to change: "bold green" now resolves to the modus
# green rather than ANSI 32.

[palettes.modus_dark]
green = "#00c06f"           # DiagnosticOk
red = "#ff7f9f"             # DiagnosticError
blue = "#79a8ff"            # Keyword
cyan = "#4ae2f0"            # Identifier
yellow = "#dfaf7a"          # DiagnosticWarn
purple = "#b6a0ff"          # Statement
"bright-black" = "#989898"  # NonText

[palettes.modus_light]
green = "#00663f"
red = "#a0132f"
blue = "#0031a9"
cyan = "#005e8b"
yellow = "#7a4f2f"
purple = "#531ab6"
"bright-black" = "#595959"
