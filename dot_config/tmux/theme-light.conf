# modus-operandi for tmux -- sourced by ~/.tmux.conf according to the shared theme
# mode, and re-sourced by theme-mode(1) when the mode changes.
#
# Hexes are the colours Neovim renders for the matching groups under
# modus_operandi, read out of nvim_get_hl -- the same source the fish and
# starship palettes use.
#   bg-dim #f2f2f2  bg-active #e0e0e0  border #9f9f9f
#   fg-main #000000  fg-dim #595959  accent #0031a9  red #a0132f

set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style 'bg=#f2f2f2,fg=#595959'

# Session name, doubling as the prefix indicator: the block turns red while the
# prefix is held.
set -g status-left-length 40
set -g status-left '#[fg=#ffffff,bg=#{?client_prefix,#a0132f,#0031a9},bold] #S #[fg=#9f9f9f,bg=#f2f2f2]│ '

# The current window carries a background AND an accent edge: background alone
# was easy to lose at a glance across a wide bar.
set -g window-status-separator ''
set -g window-status-format '#[fg=#595959]#I #W  '
set -g window-status-current-format '#[fg=#0031a9,bg=#e0e0e0]▎#[fg=#000000,bg=#e0e0e0,bold] #I #W#{?window_zoomed_flag, Z,} #[fg=#595959,bg=#f2f2f2]  '
set -g window-status-activity-style 'fg=#7a4f2f,none'
set -g window-status-bell-style 'fg=#a0132f,bold'

set -g status-right-length 60
set -g status-right '#[fg=#9f9f9f]│ #[fg=#595959]%a %d %b  #[fg=#000000,bold]%H:%M '

set -g pane-border-style 'fg=#9f9f9f'
set -g pane-active-border-style 'fg=#0031a9'
set -g message-style 'bg=#e0e0e0,fg=#000000,bold'
set -g mode-style 'bg=#e0e0e0,fg=#000000'
set -g display-panes-colour '#9f9f9f'
set -g display-panes-active-colour '#0031a9'
