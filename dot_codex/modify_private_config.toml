#!/bin/sh
# chezmoi modify_ script: the live ~/.codex/config.toml arrives on stdin and
# whatever this prints becomes its new contents.
#
# Codex writes its own state into this file -- a [projects."<abs path>"] table
# per directory you grant trust to. Those paths are machine-local and have no
# business in a public dotfiles repo, but a plain managed file would delete
# them on every apply. So: print the managed configuration below, then carry
# the live file's [projects...] tables through untouched.
#
# To change the configuration, edit the block below and `chezmoi apply
# ~/.codex/config.toml`. Do NOT `chezmoi add` this target -- that would
# replace this script with a static copy, project tables and all.
set -eu

cat <<'MANAGED'
model = "gpt-6-astra"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "xhigh"
personality = "pragmatic"

approval_policy = "on-request"
sandbox_mode = "workspace-write"
approvals_reviewer = "auto_review"

[tui]
notifications = ["agent-turn-complete", "approval-requested"]
notification_condition = "unfocused"
notification_method = "auto"
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-remaining", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.6-sol" = 1
gpt-6-astra = 1
MANAGED

# Every table header flips the switch: on for [projects] and [projects.*],
# off for anything else, so a projects table ends where the next table starts.
# Blank lines are dropped and one is re-inserted per table, which keeps the
# spacing stable no matter how Codex laid the original out.
awk '
  /^[ \t]*\[/ {
    keep = ($0 ~ /^[ \t]*\[projects[].]/)
    if (keep) print ""
  }
  keep && NF { print }
'
